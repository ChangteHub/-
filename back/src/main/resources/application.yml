server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: xust-secondhand

  # 数据源配置
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/xust_secondhand?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:115417}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # SQL初始化 - 改为never避免每次启动重置数据
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# JWT配置
# 安全要求：生产环境必须通过环境变量 JWT_SECRET 注入强密钥（无默认值，缺失则启动失败）
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时

# Knife4j配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      display-name: 校园二手交易平台API
      paths-to-match: /**
      packages-to-scan: com.xust.secondhand.controller

# 文件上传配置
# url-prefix 默认相对路径 /uploads/（前端 vite 代理与生产 Nginx 均已映射，全环境可用）
upload:
  path: ${UPLOAD_PATH:./uploads/}
  url-prefix: ${UPLOAD_URL_PREFIX:/uploads/}

# CORS配置（部署时通过环境变量覆盖）
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

logging:
  level:
    com.xust.secondhand: ${LOG_LEVEL:debug}
