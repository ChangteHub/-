server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: xust-secondhand

  # 数据源配置
  # 安全要求：数据库口令无默认值（缺失则启动失败），必须通过环境变量 DB_PASSWORD 注入
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/xust_secondhand?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 文件上传大小限制（与 UploadController 的 10MB 自校验保持一致；
  # 不配置时 Spring Boot 默认仅 1MB，会导致 1~10MB 的图片在进入控制器前被拒并返回 500）
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:10MB}

  # SQL初始化 - 改为never避免每次启动重置数据
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 走 Slf4j（由下方 LOG_LEVEL 控制），避免 StdOutImpl 在生产环境无条件打印 SQL 与参数明文
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# JWT配置
# 安全要求：生产环境必须通过环境变量 JWT_SECRET 注入强密钥（无默认值，缺失则启动失败）
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时

# Knife4j配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      display-name: 校园二手交易平台API
      paths-to-match: /**
      packages-to-scan: com.xust.secondhand.controller

# 文件上传配置
# url-prefix 默认相对路径 /uploads/（前端 vite 代理与生产 Nginx 均已映射，全环境可用）
upload:
  path: ${UPLOAD_PATH:./uploads/}
  url-prefix: ${UPLOAD_URL_PREFIX:/uploads/}

# CORS配置（部署时通过环境变量覆盖）
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

logging:
  level:
    # 默认 info：debug 会打印大量框架日志；开发调试时可通过 LOG_LEVEL=debug 覆盖
    com.xust.secondhand: ${LOG_LEVEL:info}
