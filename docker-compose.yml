# 校园二手交易平台 — Docker Compose 编排
# 安全基线：Nginx 是唯一公网入口（80）；backend/mysql 只绑 127.0.0.1；
# 所有密钥经 .env（不入 Git）注入，缺失即启动失败（:?语法）。
services:
  mysql:
    image: mysql:8.0
    container_name: secondhand-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: xust_secondhand
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"          # 只允许本机访问；宿主侧用 3307 避免与本机已有 MySQL(3306) 冲突，
                                        # 容器内仍是 3306，服务间连接不受影响
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: secondhand-backend:1.0.0     # 语义化 tag，便于回滚
    container_name: secondhand-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/xust_secondhand?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - uploads-data:/app/uploads
    ports:
      - "127.0.0.1:8080:8080"          # 由 Nginx 反代，不直接暴露
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: secondhand-frontend:1.0.0
    container_name: secondhand-nginx
    restart: unless-stopped
    ports:
      - "80:80"                         # 唯一公网入口（生产由 certbot 加 443/HTTPS）
    depends_on:
      - backend

volumes:
  mysql-data:
  uploads-data:
