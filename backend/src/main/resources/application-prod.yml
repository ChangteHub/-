# ===== 生产环境 =====
# 安全基线：DB_PASSWORD / JWT_SECRET / CORS_ALLOWED_ORIGINS 无默认值，缺失即启动失败（fail-fast），
# 必须通过环境变量或 docker compose --env-file 注入；数据库结构变更只能通过新增 Flyway 迁移脚本
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/xust_secondhand?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 2

jwt:
  secret: ${JWT_SECRET}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# 生产关闭 API 文档，避免接口信息泄露
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  production: true

logging:
  level:
    com.xust.secondhand: ${LOG_LEVEL:warn}
