# ===== 开发环境 =====
# 本地默认值仅用于开发；密码/密钥均可通过环境变量覆盖
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/xust_secondhand?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 兼容存量库：首次接入时若库非空则打 baseline（版本2=V1/V2 已手工执行过），之后只跑新迁移
    baseline-on-migrate: true
    baseline-version: 2

jwt:
  secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-38bytes!}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

logging:
  level:
    com.xust.secondhand: ${LOG_LEVEL:debug}
